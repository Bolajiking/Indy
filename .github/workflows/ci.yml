name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indyfren_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indyfren_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
          REDIS_URL: redis://localhost:6379
          TEST_REDIS_URL: redis://localhost:6379
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/indyfren_test
          NODE_ENV: test

      - name: Build backend
        run: npm run build

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/
          retention-days: 7

  test-dashboard:
    name: Test Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: cd dashboard && npm ci

      - name: Build dashboard
        run: cd dashboard && npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.indyfren.xyz
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}

      - name: Upload dashboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/.next/
          retention-days: 7

  lint:
    name: Launch Verification Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Run launch verification contract
        run: npm run verify
        env:
          ANTHROPIC_API_KEY: ci-placeholder
          SUPABASE_URL: https://supabase.com
          SUPABASE_SERVICE_KEY: ci-placeholder
          PRIVY_APP_ID: ci-placeholder
          PRIVY_APP_SECRET: ci-placeholder
          PRIVY_JWT_VERIFICATION_KEY: ci-placeholder
          MESSAGING_LINK_SECRET: ci-placeholder
          NODE_ENV: test

  smoke-preflight:
    name: Smoke Preflight Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke contract tests
        run: npm test -- tests/unit/ops/smoke-auth.test.ts tests/unit/ops/smoke-health.test.ts tests/unit/ops/mpp-smoke.test.ts
        env:
          ANTHROPIC_API_KEY: ci-placeholder
          SUPABASE_URL: https://supabase.com
          SUPABASE_SERVICE_KEY: ci-placeholder
          PRIVY_APP_ID: ci-placeholder
          PRIVY_APP_SECRET: ci-placeholder
          PRIVY_JWT_VERIFICATION_KEY: ci-placeholder
          MESSAGING_LINK_SECRET: ci-placeholder
          NODE_ENV: test

      - name: Run preflight with CI placeholder env
        run: node --import tsx scripts/preflight.ts
        env:
          ANTHROPIC_API_KEY: ci-placeholder
          SUPABASE_URL: https://supabase.com
          SUPABASE_SERVICE_KEY: ci-placeholder
          PRIVY_APP_ID: ci-placeholder
          PRIVY_APP_SECRET: ci-placeholder
          PRIVY_JWT_VERIFICATION_KEY: ci-placeholder
          MESSAGING_LINK_SECRET: ci-placeholder
          TELEGRAM_BOT_TOKEN: ci-placeholder
          ENABLE_TELEGRAM_BOT: "false"
          ENABLE_JOBS: "false"
          NEXT_PUBLIC_PRIVY_APP_ID: ci-placeholder
          NEXT_PUBLIC_PRIVY_CLIENT_ID: ci-placeholder
          NEXT_PUBLIC_API_URL: http://localhost:3000

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Install dashboard dependencies
        run: cd dashboard && npm ci

      - name: Run dashboard npm audit
        run: cd dashboard && npm audit --audit-level=high

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  deploy-backend:
    name: Deploy Backend to Railway
    needs: [test-backend, lint, smoke-preflight, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-dashboard:
    name: Deploy Dashboard to Vercel
    needs: [test-dashboard, lint, smoke-preflight, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./dashboard
          vercel-args: "--prod"
